version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # Porta do protocolo AMQP
      - "15672:15672"   # Porta do painel de administração web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  
  classificador:
    build: ./classificador
    container_name: classificador
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_HOST: rabbitmq
    


volumes:
  rabbitmq_data: